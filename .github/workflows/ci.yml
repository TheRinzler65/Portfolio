name: CI & Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-portfolio
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy to Proxmox CT
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ secrets.PUBLIC_WEB3FORMS_ACCESS_KEY }}

      - name: Sync dist/ to /var/www/portfolio/
        run: rsync -av --delete dist/ /var/www/portfolio/

      - name: Reload Nginx
        run: sudo -n systemctl reload nginx
