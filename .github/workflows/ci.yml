name: CI & Deploy

on:
  push:
    branches: [main]

# Évite les déploiements parallèles qui pourraient se piétiner sur rsync
concurrency:
  group: deploy-portfolio
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy to Proxmox CT
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ secrets.PUBLIC_WEB3FORMS_ACCESS_KEY }}

      # Le runner tourne sur le même CT que /var/www/portfolio, donc simple rsync local.
      # --delete : retire les fichiers obsolètes qui ne sont plus dans le build
      # (tous les fichiers du dossier proviennent du build : pages, public/docs, public/assets, ...)
      - name: Sync dist/ to /var/www/portfolio/
        run: rsync -av --delete dist/ /var/www/portfolio/
